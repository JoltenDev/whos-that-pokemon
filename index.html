<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokemon</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <img src="Images/pokemon-logo.webp" alt="Pokemon's Logo">
        <h1 class="color-text-primary">Who's that pokemon?!</h1>
    </header>
    <main>
        <section>
            <h2 id="success-indicator" class="color-text-secondary">placeholder</h2>
            <img id="pokemon-display" src="Images/pokemon-placeholder.png" alt="Hidden Pokemon">
        </section>
        <section>
            <label for="guess-field">Guess:</label>
            <input type="text" id="guess-field" name="guess" placeholder="Write your guess here...">
            <button id="enter-button">Guess</button>
            <button id="next-button">New Pokemon</button>
        </section>
    </main>
</body>
</html>
